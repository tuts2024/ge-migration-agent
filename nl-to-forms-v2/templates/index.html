<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gemini Next-Gen Form Engine</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div id="chat-column">
            <div id="chat-header">
                <h1>AI Form Engine</h1>
                <button id="new-form-btn" title="Clear chat and form preview">Start New Build</button>
            </div>
            <div id="chat-log">
                <div class="message ai-message">
                    Welcome! Describe the form you need, or upload an image, and I'll build it for you.
                </div>
            </div>
            <div id="chat-form-container">
                <form id="chat-form">
                    <input type="text" id="user-input" placeholder="e.g., Create a contact form with a signature field..." autocomplete="off">
                    <button type="submit" id="send-button">Send</button>
                </form>
                <div id="upload-container">
                     <label for="file-upload" id="file-upload-btn">📎 Attach File</label>
                     <input type="file" id="file-upload" style="display: none;">
                     <span id="file-info"></span>
                </div>
            </div>
        </div>
        <div id="preview-column">
            <h2>Live Form Preview</h2>
            <div id="form-preview-area">
                <p style="color: var(--text-light);">Your form preview will appear here.</p>
            </div>
            <hr>
            <h2>Generated JSON</h2>
            <pre id="json-preview-area"><code>{}</code></pre>
        </div>
    </div>
    
    <div id="map-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close-btn">&times;</span>
            <div class="modal-header">
                <input type="text" id="map-search-input" placeholder="Search for a location...">
            </div>
            <div class="modal-body">
                <div id="map"></div>
            </div>
            <div class="modal-footer">
                Lat: <input type="text" id="modal-lat-input" size="10" readonly>
                Lon: <input type="text" id="modal-lon-input" size="10" readonly>
                <button id="modal-select-btn">Select</button>
                <button id="modal-cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

     <script>
        // Global map variables
        let map;
        let marker;

        // Function called by Google Maps API on load
        function initMap() {
            const defaultLocation = { lat: 40.7128, lng: -74.0060 }; // NYC
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 8,
                center: defaultLocation,
            });
            marker = new google.maps.Marker({
                position: defaultLocation,
                map: map,
                draggable: true
            });
            google.maps.event.addListener(marker, 'dragend', function(event) {
                document.getElementById('modal-lat-input').value = event.latLng.lat().toFixed(6);
                document.getElementById('modal-lon-input').value = event.latLng.lng().toFixed(6);
            });
            google.maps.event.addListener(map, 'click', function(event) {
                marker.setPosition(event.latLng);
                document.getElementById('modal-lat-input').value = event.latLng.lat().toFixed(6);
                document.getElementById('modal-lon-input').value = event.latLng.lng().toFixed(6);
            });
            const searchInput = document.getElementById('map-search-input');
            const autocomplete = new google.maps.places.Autocomplete(searchInput);
            autocomplete.bindTo('bounds', map);
            autocomplete.addListener('place_changed', () => {
                const place = autocomplete.getPlace();
                if (!place.geometry || !place.geometry.location) { return; }
                if (place.geometry.viewport) {
                    map.fitBounds(place.geometry.viewport);
                } else {
                    map.setCenter(place.geometry.location);
                    map.setZoom(17);
                }
                marker.setPosition(place.geometry.location);
                document.getElementById('modal-lat-input').value = place.geometry.location.lat().toFixed(6);
                document.getElementById('modal-lon-input').value = place.geometry.location.lng().toFixed(6);
            });
        }

        // Main application script
        document.addEventListener('DOMContentLoaded', () => {
            const chatLog = document.getElementById('chat-log');
            const chatForm = document.getElementById('chat-form');
            const userInput = document.getElementById('user-input');
            const sendButton = document.getElementById('send-button');
            const formPreviewArea = document.getElementById('form-preview-area');
            const jsonPreviewArea = document.getElementById('json-preview-area');
            const fileUpload = document.getElementById('file-upload');
            const fileInfo = document.getElementById('file-info');
            const newFormBtn = document.getElementById('new-form-btn');
            let sessionForms = {};
            let lastMessageIdWithForm = null; 

            newFormBtn.addEventListener('click', () => { location.reload(); });
            
            const mapModal = document.getElementById('map-modal');
            if (mapModal) {
                document.body.addEventListener('click', function(event) {
                    if (event.target.id === 'pick-from-map-btn') {
                        mapModal.style.display = 'block';
                        google.maps.event.trigger(map, 'resize');
                    }
                });
                function closeModal() { mapModal.style.display = 'none'; }
                const closeBtn = mapModal.querySelector('.modal-close-btn');
                if(closeBtn) closeBtn.addEventListener('click', closeModal);
                const cancelBtn = document.getElementById('modal-cancel-btn');
                if(cancelBtn) cancelBtn.addEventListener('click', closeModal);
                const selectBtn = document.getElementById('modal-select-btn');
                if(selectBtn) selectBtn.addEventListener('click', function() {
                    const lat = document.getElementById('modal-lat-input').value;
                    const lon = document.getElementById('modal-lon-input').value;
                    const gpsLatInput = document.getElementById('gps-lat-input');
                    const gpsLonInput = document.getElementById('gps-lon-input');
                    if (gpsLatInput) gpsLatInput.value = lat;
                    if (gpsLonInput) gpsLonInput.value = lon;
                    closeModal();
                });
            }
            
            fileUpload.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        fileInfo.textContent = `Attached: ${file.name}`;
                        chatForm.dataset.fileData = e.target.result; 
                        chatForm.dataset.fileMimeType = file.type;
                    };
                    reader.readAsDataURL(file);
                }
            });

            chatForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const messageText = userInput.value.trim();
                const fileData = chatForm.dataset.fileData;
                const fileMimeType = chatForm.dataset.fileMimeType;
                if (!messageText && !fileData) return;

                toggleSendButton(true);
                appendMessage(messageText, 'user', {data: fileData, mimeType: fileMimeType});
                
                // Get the most recent JSON to send for refinement
                const currentJson = lastMessageIdWithForm ? sessionForms[lastMessageIdWithForm] : null;
                
                userInput.value = '';
                delete chatForm.dataset.fileData;
                delete chatForm.dataset.fileMimeType;
                fileInfo.textContent = "";
                fileUpload.value = "";
                try {
                    // Add current_json back to the payload sent to the server
                    const payload = { 
                        message: messageText, 
                        file_data: fileData, 
                        mime_type: fileMimeType,
                        current_json: currentJson 
                    };

                    const response = await fetch('/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    const data = await response.json();
                    const messageId = `msg-${Date.now()}`;
                    appendMessage(data.response_text, 'ai', null, messageId);

                    if (data.form_json) {
                        sessionForms[messageId] = data.form_json;
                        lastMessageIdWithForm = messageId; // Update our tracker
                        renderJsonPreview(data.form_json);
                        renderFormPreview(data.form_json);
                        addAiActions(messageId);
                    }
                } catch (error) {
                    console.error('An error occurred during form processing:', error);
                    appendMessage('Sorry, an error occurred while rendering the form preview.', 'ai');
                } finally {
                    toggleSendButton(false);
                }
            });

            function appendMessage(text, sender, file = null, messageId = '') {
                 if (typeof text !== 'string') return;
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}-message`;
                if (messageId) messageDiv.id = messageId;
                let content = text.replace(/\\n/g, '<br>');
                if (file && file.data && sender === 'user') {
                    if(content) content += '<br>';
                    if (file.mimeType && file.mimeType.startsWith('image/')) {
                        content += `<img src="${file.data}" class="thumbnail" alt="Uploaded image">`;
                    } else if (file.mimeType && file.mimeType.startsWith('video/')) {
                        content += `<video src="${file.data}" class="thumbnail" controls></video>`;
                    } else {
                        const fileName = document.getElementById('file-info').textContent.replace('Attached: ', '');
                        content += `<div class="file-preview">📄 File Attached: ${fileName}</div>`;
                    }
                }
                messageDiv.innerHTML = content;
                chatLog.appendChild(messageDiv);
                chatLog.scrollTop = chatLog.scrollHeight;
            }
        
            function addAiActions(messageId) {
                const messageDiv = document.getElementById(messageId);
                if (!messageDiv) return;
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'message-actions';
                const actionsBtn = document.createElement('button');
                actionsBtn.className = 'actions-btn';
                actionsBtn.textContent = '🤖 AI Actions';
                const menuDiv = document.createElement('div');
                menuDiv.className = 'actions-menu';
                const actions = {
                    'Translate...': 'translate', 'Analyze for Compliance': 'analyze_compliance',
                    'Suggest Workflows': 'suggest_workflows', 'Generate Help Text': 'generate_help_text'
                };
                Object.entries(actions).forEach(([label, action]) => {
                    const actionSpan = document.createElement('span');
                    actionSpan.textContent = label;
                    actionSpan.onclick = () => runAiAction(messageId, action, label, actionsBtn);
                    menuDiv.appendChild(actionSpan);
                });
                actionsBtn.onclick = (e) => {
                    e.stopPropagation();
                    document.querySelectorAll('.actions-menu').forEach(m => { if(m !== menuDiv) m.style.display = 'none' });
                    menuDiv.style.display = menuDiv.style.display === 'block' ? 'none' : 'block';
                };
                actionsDiv.appendChild(actionsBtn);
                actionsDiv.appendChild(menuDiv);
                messageDiv.appendChild(actionsDiv);
            }

                 async function runAiAction(messageId, action, label, btn) {
                const formJson = sessionForms[messageId];
                if (!formJson) return;
                
                btn.textContent = 'Thinking...';
                btn.disabled = true;
                const menu = btn.closest('.message-actions').querySelector('.actions-menu');
                if(menu) menu.style.display = 'none';

                let language = null;
                if (action === 'translate') {
                    language = prompt("Which language would you like to translate to? (e.g., Spanish, Japanese)");
                    if (!language) {
                        btn.textContent = '🤖 AI Actions';
                        btn.disabled = false;
                        return;
                    }
                }

                try {
                    const response = await fetch('/enhance', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            form_json: formJson,
                            action: action,
                            language: language
                        })
                    });
                    
                    const result = await response.json();

                    if (!response.ok) {
                        // Catches server-side errors (like 500)
                        throw new Error(result.error || `Server responded with status ${response.status}`);
                    }

                    if (result.updated_form_json) {
                        sessionForms[messageId] = result.updated_form_json;
                        renderFormPreview(result.updated_form_json);
                        renderJsonPreview(result.updated_form_json);
                        appendMessage(`OK, I've applied the action: ${label}. The form has been updated.`, 'ai');
                    } else if (result.analysis_text) {
                         appendMessage(`Here is the analysis you requested for '${label}':\\n${result.analysis_text}`, 'ai');
                    } else if (result.error) {
                        // Catches application-level errors sent from the backend
                        throw new Error(result.error);
                    } else {
                        throw new Error("Received an unexpected response from the server.");
                    }

                } catch (error) {
                    console.error("AI Action Error:", error);
                    // Display the error to the user in a new chat bubble
                    appendMessage(`Sorry, the action '${label}' failed. Reason: ${error.message}`, 'ai');
                } finally {
                    btn.textContent = '🤖 AI Actions';
                    btn.disabled = false;
                }
            }
        
            function toggleSendButton(isSending) {
                if (sendButton) {
                    sendButton.disabled = isSending;
                    sendButton.textContent = isSending ? '...' : 'Send';
                }
            }

            function renderFormPreview(formData) {
                formPreviewArea.innerHTML = '';
                if (!formData || !Array.isArray(formData.pages) || formData.pages.length === 0) {
                    formPreviewArea.innerHTML = '<p style="color: var(--text-light);">Form has no pages.</p>';
                    return;
                }
                let formTitle = document.createElement('h2');
                formTitle.textContent = formData.form_name || 'Untitled Form';
                formPreviewArea.appendChild(formTitle);
                formData.pages.forEach(page => {
                    const pageContainer = document.createElement('div');
                    pageContainer.className = 'page-container';
                    pageContainer.innerHTML = `<div class="page-header">${page.page_name || 'Untitled Page'}</div>`;
                    const pageContent = document.createElement('div');
                    pageContent.className = 'page-content';
                    if (Array.isArray(page.fields)) {
                        page.fields.forEach(field => {
                            if (!field || typeof field !== 'object') return;
                            const fieldDiv = document.createElement('div');
                            fieldDiv.className = 'form-field';
                            
                            // MODIFIED: More robust check for the display name
                            const displayName = field.display_name || field.label || field.name || field.title || 'Untitled Field';
                            
                            const helpText = field.help_text ? `<small>${field.help_text}</small>` : '';
                            let fieldHtml = `<label>${displayName}${helpText}</label>`;
                            
                            const options = Array.isArray(field.options) ? field.options : [];
                            
                            // MODIFIED: More robust check for the field type
                            const fieldType = field.type || field.field_type || 'text';
                            
                            let inputHtml = '';
                            switch (fieldType) {
                                case 'text':
                                    inputHtml = `<input type="text" placeholder="${field.placeholder || ''}">`;
                                    break;
                                case 'email':
                                    inputHtml = `<input type="email" placeholder="${field.placeholder || 'you@example.com'}">`;
                                    break;
                                case 'tel':
                                    inputHtml = `<input type="tel" placeholder="${field.placeholder || '123-456-7890'}">`;
                                    break;
                                case 'textarea':
                                    inputHtml = `<textarea placeholder="${field.placeholder || ''}"></textarea>`;
                                    break;
                                case 'select':
                                case 'dropdown':
                                    inputHtml = `<select><option value="">-- Select --</option>${options.map(o => `<option value="${o}">${o}</option>`).join('')}</select>`;
                                    break;
                                case 'radio':
                                case 'radio_group':
                                    inputHtml = `<div class="radio-group">${options.map(opt => {
                                        const value = typeof opt === 'object' && opt.value !== undefined ? opt.value : opt;
                                        const label = typeof opt === 'object' && opt.label !== undefined ? opt.label : opt;
                                        return `<div><input type="radio" name="${field.field_id || displayName}" value="${value}"> ${label}</div>`;
                                    }).join('')}</div>`;
                                    break;
                                case 'checkbox':
                                case 'checklist':
                                    inputHtml = `<div class="checklist-group">${options.map(opt => {
                                        const value = typeof opt === 'object' && opt.value !== undefined ? opt.value : opt;
                                        const label = typeof opt === 'object' && opt.label !== undefined ? opt.label : opt;
                                        return `<div><input type="checkbox" name="${field.field_id || displayName}" value="${value}"> ${label}</div>`;
                                    }).join('')}</div>`;
                                    break;
                                case 'photo':
                                case 'photo_upload':
                                    inputHtml = `<label for="photo-input-${field.field_id}" class="photo-upload-wrapper">
                                                    <span class="photo-upload-label">Click to upload photo</span>
                                                    <input type="file" accept="image/*" id="photo-input-${field.field_id}" class="photo-upload-input" data-preview-id="photo-preview-${field.field_id}">
                                                    <img src="#" alt="Image preview" id="photo-preview-${field.field_id}" class="photo-preview-img" style="display: none;">
                                                 </label>`;
                                    break;
                                case 'signature':
                                case 'signature_pad':
                                    inputHtml = `<div class="signature-pad-wrapper">
                                                    <canvas id="signature-canvas-${field.field_id}" class="signature-canvas"></canvas>
                                                    <button type="button" class="signature-pad-clear" data-canvas-id="signature-canvas-${field.field_id}">Clear</button>
                                                 </div>`;
                                    break;
                                case 'group':
                                case 'compound':
                                    inputHtml = `<div class="address-block" style="display: flex; gap: 10px;">
                                                    <input type="text" placeholder="Latitude" style="flex: 1;" id="gps-lat-input">
                                                    <input type="text" placeholder="Longitude" style="flex: 1;" id="gps-lon-input">
                                                 </div>
                                                 <button type="button" id="pick-from-map-btn" class="map-btn">Pick from map</button>`;
                                    break;
                                case 'address': inputHtml = '<div class="address-block"><input type="text" placeholder="Street Address"><input type="text" placeholder="City"><input type="text" placeholder="State"><input type="text" placeholder="Zip Code"></div>'; break;
                                case 'dynamic_table': inputHtml = '<div class="dynamic-table"><table><tr><th>Description</th><th>Quantity</th><th>Unit Price</th></tr><tr><td></td><td></td><td></td></tr></table><button>+ Add Row</button></div>'; break;
                                default:
                                    inputHtml = `<input type="text" placeholder="Unsupported field type: ${fieldType}">`;
                            }
                            fieldDiv.innerHTML = fieldHtml + inputHtml;
                            pageContent.appendChild(fieldDiv);
                        });
                    }
                    pageContainer.appendChild(pageContent);
                    formPreviewArea.appendChild(pageContainer);
                });
                initializeSignaturePads();
                initializePhotoPreviews();
            }
            
            function initializeSignaturePads() {
                const signatureCanvases = formPreviewArea.querySelectorAll('.signature-canvas');
                signatureCanvases.forEach(canvas => {
                    const signaturePad = new SignaturePad(canvas);
                    const ratio = Math.max(window.devicePixelRatio || 1, 1);
                    canvas.width = canvas.offsetWidth * ratio;
                    canvas.height = canvas.offsetHeight * ratio;
                    canvas.getContext("2d").scale(ratio, ratio);
                    signaturePad.clear(); 
                });
                document.querySelectorAll('.signature-pad-clear').forEach(button => {
                    if (button.handlerAttached) return;
                    button.addEventListener('click', (event) => {
                        const canvasId = event.target.dataset.canvasId;
                        const canvas = document.getElementById(canvasId);
                        if (canvas) {
                            const tempPad = new SignaturePad(canvas);
                            tempPad.clear();
                        }
                    });
                    button.handlerAttached = true;
                });
            }

            function initializePhotoPreviews() {
                formPreviewArea.querySelectorAll('.photo-upload-input').forEach(input => {
                    if (input.handlerAttached) return;
                    input.addEventListener('change', function(event) {
                        const file = event.target.files[0];
                        if (file && file.type.startsWith('image/')) {
                            const previewId = event.target.dataset.previewId;
                            const previewImg = document.getElementById(previewId);
                            const uploadLabel = previewImg.closest('.photo-upload-wrapper').querySelector('.photo-upload-label');
                            const reader = new FileReader();
                            reader.onload = function(e) {
                                previewImg.src = e.target.result;
                                previewImg.style.display = 'block';
                                if(uploadLabel) uploadLabel.style.display = 'none';
                            }
                            reader.readAsDataURL(file);
                        }
                    });
                    input.handlerAttached = true;
                });
            }
            
            function renderJsonPreview(jsonData) {
                if (jsonPreviewArea) {
                    jsonPreviewArea.querySelector('code').textContent = JSON.stringify(jsonData, null, 2);
                }
            }
        });
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key={{ maps_api_key }}&libraries=places&callback=initMap" async defer></script>
</body>
</html>
